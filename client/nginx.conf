server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://node-api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /analytics/ {
        proxy_pass http://python-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A cold (cache-miss) LSTM forecast trains twice (holdout split +
        # final fit) before the first response byte. This isn't just
        # proportional to period length (measured 2y and 5y both landing in
        # the 30-150s range, not 5y taking ~5x longer than 1y) — PyTorch's
        # CPU backend pays a large, variable one-time warm-up cost on a
        # process's first LSTM invocation (observed 65-150s of it alone),
        # which can land in either the training or inference phase. 120s
        # wasn't enough margin for that; 240s comfortably covers the
        # worst case measured (~150s) plus headroom for another cold spike.
        proxy_connect_timeout 240s;
        proxy_send_timeout    240s;
        proxy_read_timeout    240s;
    }
}
