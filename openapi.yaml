openapi: 3.0.3

info:
  title: Asian Capital Markets — Analytics API
  description: |
    Python FastAPI analytics service for the Asian Capital Markets Intelligence Platform —
    272 companies across 14 Asian economies (China, Hong Kong, India, Indonesia, Japan,
    Malaysia, Pakistan, Saudi Arabia, Singapore, South Korea, Taiwan, Thailand, UAE, Vietnam)
    and 11 market sectors.

    Provides descriptive statistics, rolling moving averages, pairwise correlation,
    anomaly detection, clustering, nearest-neighbor similarity, and price forecasting
    across **8 interchangeable models plus a naive baseline** behind one endpoint
    (`/analytics/models/forecast/{ticker}`): `arima`, `ets`, `sarima`, `prophet`, `ridge`,
    `random_forest`, `xgboost`, `lstm`, and `naive` (the random-walk reference every other
    model is scored against).

    Every model reports the same **cost metrics** next to its forecast —
    `inference_latency_ms`, `train_time_s`, `memory_mb` (and `rss_mb`) — plus holdout
    `rmse`/`mae`, so accuracy and compute cost are comparable model-to-model.
    `random_forest`/`xgboost`/`lstm` responses are cached in Redis for 24h; a response
    carries an `X-Cache: HIT`/`MISS` header reporting whether it was served from that cache.

    Rolling-origin cross-validation and multi-ticker x multi-model batch benchmarking
    always run asynchronously via Celery: the triggering endpoint returns a `task_id`
    immediately, polled through the generic `/tasks/status/{task_id}` endpoint (or the
    progress-aware `/analytics/batch-benchmark/{task_id}/status` for that specific task).

    **This document also covers the Node.js gateway** (`server/`, see the "Gateway" tag) —
    a separate Express service that feeds the React client's market-overview/company/history
    pages under `/api/*`. The two backends are independent processes. In Docker, Nginx proxies
    `/api/*` to the Node gateway and `/analytics/*` to this service on port 3000, but endpoints
    outside those two prefixes — `/health`, `/admin`, `/tasks/*`, `/internal/*`, and the
    `/ws/tasks` WebSocket — are reachable only by calling this service directly on port 8000;
    Nginx has no route for them.

    **Data source:** PostgreSQL (`daily_prices` table), kept current by a nightly delta-fetch
    job that appends new OHLCV rows and flushes the forecast cache
    (`DELETE /internal/cache/invalidate`) whenever it adds data.

    **In Docker:** accessible at `http://localhost:8000` directly,
    or via Nginx proxy at `http://localhost:3000/analytics/` (for `/analytics/*` routes only)
  version: "1.0.0"
  contact:
    name: Asian Economy Analysis

servers:
  - url: http://localhost:8000
    description: Local Docker (python-api container)
  - url: http://localhost:3000/analytics
    description: Via Nginx proxy (production)

security: []
# No endpoint in this document (either backend) requires authentication — everything here
# sits behind Docker's own network boundary / the Nginx proxy, with no auth layer in front of
# either service. Declared explicitly (rather than left unset) so that is a documented fact,
# not an omission.

tags:
  - name: Health
    description: Service health check
  - name: Summary
    description: Descriptive statistics (mean, median, std, min, max) for groups of companies
  - name: Rolling
    description: Daily close prices with N-day rolling moving average
  - name: Forecast
    description: ARIMA(1,1,1) price forecasting with 95% confidence intervals (legacy, kept for backward compatibility)
  - name: Models
    description: Unified multi-model forecasting (ARIMA, ETS, SARIMA, Prophet, Ridge, Random Forest, XGBoost) with CE performance metrics
  - name: Correlation
    description: Pairwise Pearson correlation of daily returns across companies in a country
  - name: Anomalies
    description: Anomaly detection (IsolationForest + Z-score) on weekly returns across companies in a country
  - name: Clusters
    description: K-means clustering of all companies on return/volatility behavior
  - name: Network
    description: Minimum spanning tree over the correlation-distance matrix for a country's companies
  - name: Validation
    description: Rolling-origin cross-validation and multi-ticker/multi-model batch benchmarking (always async)
  - name: Internal
    description: Internal-only endpoints (no auth) — called by other services in this stack, not meant for external clients.
  - name: Tasks
    description: >-
      Generic Celery task control — trigger a background job and poll its status or history.
      Not specific to any one analytics feature; also the generic polling endpoint for tasks
      queued elsewhere, e.g. `/analytics/validation/rolling/{ticker}`.
  - name: Admin
    description: Static operator dashboard. Excluded from this service's own auto-generated schema; documented here by hand.
  - name: Gateway
    description: >-
      The Node.js/Express gateway (`server/`) — a separate service from everything else in
      this document. Serves the React client's market-overview, company, and price-history
      data under `/api/*`. Each path below carries its own `servers` entry since it is not
      reachable from this service's own host/port.

x-websocket-endpoints:
  /ws/tasks:
    description: >-
      Plain WebSocket (not Socket.IO) broadcast channel. OpenAPI 3.0 has no way to describe
      WebSocket endpoints in `paths`, so it is documented here as an extension instead. On
      connect, the server subscribes the connection to the `task_events` Redis Pub/Sub channel
      and forwards every message published on it, verbatim, as a text frame — it never reads
      anything the client sends. Each forwarded message is the JSON object
      `{task_id, operation, status, result, completed_at}` that `app/tasks.py` publishes when
      any Celery task (`send_email_notification`, `run_market_analysis`,
      `run_rolling_validation`, `run_batch_benchmark`) finishes — the same shape
      `GET /tasks/history` rows have. Consumed by the `/admin` dashboard to show task
      completions live, with no polling.
    url: ws://localhost:8000/ws/tasks
    note: Direct only — not proxied by Nginx (no `/ws/` location exists in `client/nginx.conf`).

paths:

  /health:
    servers:
      - url: http://localhost:8000
        description: Local Docker (python-api container) — direct only, not proxied by Nginx
    get:
      tags: [Health]
      summary: Health check
      description: Returns `{"status":"ok"}` if the service is running and connected.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /analytics/summary:
    get:
      tags: [Summary]
      summary: Descriptive statistics for a group of companies
      description: |
        Computes mean, median, standard deviation, min, and max for:
        - Latest **close price** across matched companies
        - **5-day weekly return** (percentage change vs 5 trading days ago)

        Filter by `country`, `sector`, both, or neither (returns stats for all companies).
      parameters:
        - name: country
          in: query
          required: false
          description: Filter by country name (e.g. `Japan`, `South Korea`, `Saudi Arabia`)
          schema:
            type: string
            example: Japan
        - name: sector
          in: query
          required: false
          description: |
            Filter by sector name. One of:
            Communication Services, Consumer Discretionary, Consumer Staples,
            Energy, Financials, Health Care, Industrials, Information Technology,
            Materials, Real Estate, Utilities
          schema:
            type: string
            example: Financials
      responses:
        "200":
          description: Statistics computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
              example:
                filters:
                  country: Japan
                  sector: null
                companyCount: 22
                price:
                  mean: 3241.85
                  median: 1850.5
                  std: 4102.33
                  min: 112.4
                  max: 19800.0
                  count: 22
                weeklyReturn:
                  mean: 0.42
                  median: 0.31
                  std: 1.87
                  min: -3.12
                  max: 4.55
                  count: 22
        "404":
          description: No data found for given filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/rolling/{ticker}:
    get:
      tags: [Rolling]
      summary: Close price + rolling moving average
      description: |
        Returns a time series of daily close prices plus an N-day rolling moving average
        for the specified ticker.

        The response key for the moving average is dynamic: `ma{window}` (e.g. `ma30`, `ma7`).

        **period** maps to history length:
        - `3m` → 90 days
        - `6m` → 180 days
        - `1y` → 365 days
        - `2y` → 730 days
        - `5y` → 1825 days
      parameters:
        - name: ticker
          in: path
          required: true
          description: Yahoo Finance ticker symbol (e.g. `9988.HK`, `005930.KS`, `7203.T`)
          schema:
            type: string
            example: 9988.HK
        - name: window
          in: query
          required: false
          description: Rolling window in trading days (min 2, max 200)
          schema:
            type: integer
            default: 30
            minimum: 2
            maximum: 200
            example: 30
        - name: period
          in: query
          required: false
          description: History window — 3m | 6m | 1y | 2y | 5y
          schema:
            type: string
            default: 1y
            enum: [3m, 6m, 1y, 2y, 5y]
            example: 1y
      responses:
        "200":
          description: Rolling average time series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollingResponse"
              example:
                ticker: 9988.HK
                window: 30
                period: 1y
                data:
                  - date: "2024-01-02"
                    close: 72.45
                    ma30: 71.80
                  - date: "2024-01-03"
                    close: 73.10
                    ma30: 71.95
        "404":
          description: No data found for ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/forecast/{ticker}:
    get:
      tags: [Forecast]
      summary: ARIMA(1,1,1) price forecast
      description: |
        Fits an **ARIMA(1,1,1)** model on historical close prices and returns:
        - `history` — real prices used for model training (business-day aligned, gaps forward-filled)
        - `forecast` — N-day forward predictions with **95% confidence interval** bounds

        **How it works:**
        1. Fetches close prices from PostgreSQL for the specified history window
        2. Resamples to business-day frequency, fills gaps with forward-fill
        3. Fits ARIMA(1,1,1) via statsmodels
        4. Projects `days` steps ahead
        5. Returns confidence interval (alpha=0.05)

        **Constraints:**
        - Minimum 60 rows of history required — raises 422 otherwise
        - `days` range: 7 to 90
        - Wider forecast horizon = wider confidence bands (uncertainty compounds)
      parameters:
        - name: ticker
          in: path
          required: true
          description: Yahoo Finance ticker symbol
          schema:
            type: string
            example: 9988.HK
        - name: days
          in: query
          required: false
          description: Forecast horizon in trading days (7–90)
          schema:
            type: integer
            default: 30
            minimum: 7
            maximum: 90
            example: 30
        - name: period
          in: query
          required: false
          description: History window used for ARIMA training — 6m | 1y | 2y | 5y
          schema:
            type: string
            default: 1y
            enum: [6m, 1y, 2y, 5y]
            example: 1y
      responses:
        "200":
          description: ARIMA forecast result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"
              example:
                ticker: 9988.HK
                model: ARIMA(1,1,1)
                days: 30
                period: 1y
                history:
                  - date: "2024-01-02"
                    actual: 72.45
                  - date: "2024-01-03"
                    actual: 73.10
                forecast:
                  - date: "2025-01-06"
                    predicted: 74.32
                    lower: 68.11
                    upper: 80.53
                  - date: "2025-01-07"
                    predicted: 74.58
                    lower: 67.21
                    upper: 81.95
        "422":
          description: Not enough historical data (need ≥ 60 rows)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "Not enough data for XYZ — need 60 rows, got 12"

  /analytics/models/forecast/{ticker}:
    get:
      tags: [Models]
      summary: Multi-model price forecast with CE performance metrics
      description: |
        Unified forecast endpoint — routes to the requested model and returns predictions
        plus CE (compute-efficiency) performance metrics: `inference_latency_ms`,
        `train_time_s`, `memory_mb`, `rmse`, `mae`.

        Every model is fit on the requested history window, evaluated on a 20% holdout
        split for `rmse`/`mae`, then re-fit on the full series to produce the forward
        `forecast` (predictions) array.

        **Available models:**
        - `arima` — ARIMA(1,1,1)
        - `ets` — ETS / Holt-Winters (additive trend + seasonality, 5-day seasonal period)
        - `sarima` — SARIMAX, order=(1,1,1), seasonal_order=(1,1,0,5)
        - `prophet` — Meta Prophet (weekly + yearly seasonality, no daily seasonality)
        - `ridge` — Ridge regression on lagged close prices (lags 1,2,3,5,10,20 + time index)
        - `random_forest` — RandomForestRegressor (n_estimators=100) on the same lagged features
        - `xgboost` — XGBRegressor (n_estimators=100, learning_rate=0.1) on the same lagged features
        - `lstm` — 2-layer PyTorch LSTM (hidden_size=64, dropout=0.2) over MinMax-normalized
          close prices, 60-day lookback window, 50 epochs. Needs ≥120 rows of history
          (vs. 60 for every other model). Slowest model in the stack — see caching below.
        - `naive` — random-walk baseline: forecast = last observed close, repeated for every
          step. Cheap, uncached, used as the reference point for every other model's
          RMSE (see `/analytics/validation/rolling/{ticker}` and `/analytics/batch-benchmark`).

        `enriched=true` switches `ridge`/`random_forest`/`xgboost` from price-only lag
        features to lag features **+ fundamentals** (`beta`, `pe_ratio`, `log_market_cap`,
        `dividend_yield`, from the `fundamentals` table) **+ macro** (`log_gdp`,
        `unemployment`, from the Node API's `/api/macros`). Silently ignored for
        `arima`/`ets`/`sarima`/`prophet`/`lstm`, which have no feature vector to enrich.

        `random_forest`/`xgboost`/`lstm` responses are cached in Redis for 24h
        (key: `forecast:{ticker}:{model}:{days}:{period}:{enriched}`) since they're
        markedly slower than the other models — a `X-Cache: HIT`/`MISS` response header
        reports whether this request hit the cache. The cache is flushed by the nightly
        delta-fetch job once new price data lands.

        This is the successor to `/analytics/forecast/{ticker}`, which remains available
        (ARIMA-only, no `model`/`enriched` params, no CE metrics) for backward compatibility.
      parameters:
        - name: ticker
          in: path
          required: true
          description: Yahoo Finance ticker symbol
          schema:
            type: string
            example: 9988.HK
        - name: model
          in: query
          required: false
          description: Which model to run
          schema:
            type: string
            default: arima
            enum: [arima, ets, sarima, prophet, ridge, random_forest, xgboost, lstm, naive]
            example: arima
        - name: days
          in: query
          required: false
          description: Forecast horizon in trading days (7–90)
          schema:
            type: integer
            default: 30
            minimum: 7
            maximum: 90
            example: 30
        - name: period
          in: query
          required: false
          description: History window used for training — 6m | 1y | 2y | 5y
          schema:
            type: string
            default: 1y
            enum: [6m, 1y, 2y, 5y]
            example: 1y
        - name: enriched
          in: query
          required: false
          description: >-
            Add fundamentals + macro features for ridge/random_forest/xgboost
            (ignored for arima/ets/sarima/prophet/lstm).
          schema:
            type: boolean
            default: false
            example: false
      responses:
        "200":
          description: Forecast result with CE metrics
          headers:
            X-Cache:
              description: Only present for random_forest/xgboost/lstm.
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelForecastResponse"
              example:
                ticker: 9988.HK
                model: arima
                days: 30
                period: 1y
                enriched: false
                history:
                  - date: "2026-08-19"
                    actual: 126.05
                forecast:
                  - date: "2026-08-21"
                    predicted: 126.85
                    lower: 121.18
                    upper: 132.30
                metrics:
                  model_name: arima
                  rmse: 13.3555
                  mae: 10.7978
                  inference_latency_ms: 97.8
                  train_time_s: 0.43
                  memory_mb: 0.85
        "400":
          description: Unknown model name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "Unknown model 'lightgbm'. Available: ['arima', 'ets', 'lstm', 'naive', 'prophet', 'random_forest', 'ridge', 'sarima', 'xgboost']"
        "422":
          description: Not enough historical data (need ≥ 60 rows, ≥120 for lstm)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/correlation:
    get:
      tags: [Correlation]
      summary: Pairwise correlation of daily returns across a country's companies
      description: |
        Computes the pairwise Pearson correlation matrix of **daily returns** (not raw
        price levels, to avoid spurious trend-driven correlation) across every company
        in the given country, over the requested period.

        Returns every valid pair plus the top 10 most correlated (`topCorrelated`) and
        top 10 most divergent/anti-correlated (`leastCorrelated`) pairs, sorted by
        correlation value.

        `order=clustered` additionally runs average-linkage hierarchical clustering
        over the correlation-distance matrix (`d = sqrt(2*(1-rho))`) and returns
        `orderedTickers`: the same tickers in dendrogram leaf order, so a heatmap
        drawn in that order groups correlated companies together instead of sorting
        alphabetically. `tickers` (alphabetical) is always returned either way.
      parameters:
        - name: country
          in: query
          required: true
          description: Country name (e.g. `Japan`, `South Korea`, `Saudi Arabia`)
          schema:
            type: string
            example: Japan
        - name: period
          in: query
          required: false
          description: History window — 3m | 6m | 1y | 2y | 5y
          schema:
            type: string
            default: 1y
            enum: [3m, 6m, 1y, 2y, 5y]
            example: 1y
        - name: order
          in: query
          required: false
          description: default (alphabetical) or clustered (hierarchical-clustering leaf order)
          schema:
            type: string
            default: default
            enum: [default, clustered]
            example: clustered
      responses:
        "200":
          description: Correlation matrix computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrelationResponse"
              example:
                country: Japan
                period: 1y
                order: clustered
                tickers: ["1605.T", "4502.T", "8306.T"]
                orderedTickers: ["4502.T", "1605.T", "8306.T"]
                pairCount: 231
                pairs:
                  - ticker_a: 8801.T
                    ticker_b: 8830.T
                    correlation: 0.8023
                topCorrelated:
                  - ticker_a: 8801.T
                    ticker_b: 8830.T
                    correlation: 0.8023
                leastCorrelated:
                  - ticker_a: 2269.T
                    ticker_b: 9984.T
                    correlation: -0.2882
                computation_time_ms: 20.05
        "404":
          description: No price data for the given country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Fewer than 2 tickers with data in the given country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/anomalies:
    get:
      tags: [Anomalies]
      summary: Anomaly detection on weekly returns across a country's companies
      description: |
        Flags anomalous companies within a country by two independent methods:
        - **IsolationForest** (`contamination=0.05`) over each company's weekly-return
          time series (rows = companies, columns = weeks)
        - a **Z-score** check on each company's latest weekly return vs its own
          return history (`|z| > 2`)

        `detection_method` reports which method(s) flagged the company:
        `"isolation_forest"`, `"zscore"`, `"both"`, or `null` if not anomalous.

        `include_knn=true` adds a third, independent detector: distance to
        the `knn_k`-th nearest neighbor in the same standardized
        (mean_weekly_return, volatility) space `/analytics/clusters` uses,
        flagged above the `knn_percentile` percentile. Off by default —
        this detector has not been event-study validated like the other
        two, and the default response is byte-identical whether or not
        this parameter exists. When included, `detection_method` may
        report `"knn_distance"` alone or combined with the others
        (`"isolation_forest+knn_distance"`, etc.) — the pre-existing
        `"both"` string is only ever isolation_forest+zscore, unchanged.
      parameters:
        - name: country
          in: query
          required: true
          description: Country name
          schema:
            type: string
            example: Japan
        - name: period
          in: query
          required: false
          description: History window — 3m | 6m | 1y | 2y | 5y
          schema:
            type: string
            default: 1y
            enum: [3m, 6m, 1y, 2y, 5y]
            example: 1y
        - name: include_knn
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: knn_k
          in: query
          required: false
          description: Which nearest neighbor's distance to use.
          schema: { type: integer, default: 5, minimum: 1, maximum: 20 }
        - name: knn_percentile
          in: query
          required: false
          schema: { type: number, default: 95.0, minimum: 50.0, maximum: 99.9 }
      responses:
        "200":
          description: Anomaly scan computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyResponse"
              example:
                country: Japan
                period: 1y
                companyCount: 22
                anomalyCount: 2
                companies:
                  - ticker: 9984.T
                    latest_weekly_return: -0.0613
                    anomaly_score: 0.1119
                    is_anomaly: true
                    zscore: -0.7327
                    detection_method: isolation_forest
                computation_time_ms: 307.2
        "404":
          description: No price data for the given country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Fewer than 2 tickers with enough weekly history in the given country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/clusters:
    get:
      tags: [Clusters]
      summary: K-means clustering of all companies on return/volatility behavior
      description: |
        Clusters every company (market-wide, no country filter) on two currency-neutral,
        return-based features: `mean_weekly_return` and `volatility` (std of weekly
        returns). Both are standardized (`StandardScaler`) before `KMeans` so neither
        dominates due to raw magnitude.

        Note: an earlier version also used raw local-currency `avg_close_price`
        (min-max normalized), which caused currency-scale artifacts to dominate
        clustering — that feature was removed.
      parameters:
        - name: n_clusters
          in: query
          required: false
          description: Number of clusters (2–10)
          schema:
            type: integer
            default: 5
            minimum: 2
            maximum: 10
            example: 5
        - name: period
          in: query
          required: false
          description: History window used to compute return/volatility features — 3m | 6m | 1y | 2y | 5y
          schema:
            type: string
            default: 1y
            enum: [3m, 6m, 1y, 2y, 5y]
            example: 1y
      responses:
        "200":
          description: Clustering computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterResponse"
              example:
                n_clusters: 5
                period: 1y
                companyCount: 270
                companies:
                  - ticker: 0001.HK
                    name: CK Hutchison Holdings
                    country: Hong Kong
                    sector: Industrials
                    cluster_id: 0
                    mean_weekly_return: 0.0063
                    volatility: 0.0325
                cluster_summary:
                  - cluster_id: 0
                    size: 111
                    mean_return: 0.0022
                    mean_volatility: 0.0285
                    dominant_country: Singapore
                    dominant_sector: Consumer Staples
                computation_time_ms: 2300.4
        "404":
          description: No price data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Fewer companies with sufficient data than n_clusters requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/network:
    get:
      tags: [Network]
      summary: Minimum spanning tree over a country's correlation-distance matrix
      description: |
        Builds the correlation-distance matrix (`d = sqrt(2*(1-rho))` on daily returns,
        same definition `/analytics/correlation`'s clustered order uses) for every
        company in a country, then returns the minimum spanning tree over it — the
        sparsest graph that keeps every company connected to its closest peers, for a
        node-link visualization (nodes colored by sector, edge thickness ~ closeness).
      parameters:
        - name: country
          in: query
          required: true
          description: Country name
          schema:
            type: string
            example: Japan
        - name: period
          in: query
          required: false
          description: History window — 3m | 6m | 1y | 2y | 5y
          schema:
            type: string
            default: 1y
            enum: [3m, 6m, 1y, 2y, 5y]
            example: 1y
      responses:
        "200":
          description: MST computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkResponse"
              example:
                country: Japan
                period: 1y
                nodes:
                  - ticker: 1605.T
                    name: INPEX Corporation
                    sector: Energy
                edges:
                  - source: 1605.T
                    target: 5020.T
                    distance: 0.9074
                computation_time_ms: 450.2
        "404":
          description: No price data for the given country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Fewer than 2 tickers with data in the given country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/similar/{ticker}:
    get:
      tags: [Network]
      summary: The n companies closest to a given ticker
      description: |
        `space=features`: Euclidean distance on standardized
        (mean_weekly_return, volatility) — same feature definition
        `/analytics/clusters` uses. `scope=global` allowed.

        `space=correlation`: `d = sqrt(2*(1-rho))` on daily returns, same
        definition `/analytics/network` uses. **`scope=country` only** —
        comparing correlation across exchanges with non-overlapping
        trading days/holidays would conflate "didn't trade on the same
        days" with "genuinely uncorrelated", so `scope=global` is
        rejected (400) for this space rather than silently returning a
        distorted number.
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string, example: 9988.HK }
        - name: n
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1, maximum: 20 }
        - name: space
          in: query
          required: false
          schema: { type: string, default: features, enum: [features, correlation] }
        - name: scope
          in: query
          required: false
          schema: { type: string, default: country, enum: [country, global] }
        - name: period
          in: query
          required: false
          schema: { type: string, default: 1y, enum: [3m, 6m, 1y, 2y, 5y] }
      responses:
        "200":
          description: Nearest companies, sorted by distance ascending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarResponse"
              example:
                ticker: 9988.HK
                space: features
                scope: country
                country: China
                n: 5
                results:
                  - ticker: 3690.HK
                    name: Meituan
                    sector: Consumer Discretionary
                    distance: 0.7063
                computation_time_ms: 47.3
        "400":
          description: space=correlation requested with scope=global
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown ticker, or no price data in the requested scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not enough feature/return data for the given ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/validation/rolling/{ticker}:
    post:
      tags: [Validation]
      summary: Start a rolling-origin cross-validation run (always async)
      description: |
        Repeatedly moves the forecast origin forward (expanding or sliding window),
        fitting each requested model fresh at every origin and scoring it against the
        realized next `horizon` days. Mirrors `research/rolling_benchmark.py`'s
        methodology, driving the production `MODEL_REGISTRY` classes.

        Always asynchronous (never inline) — this is dozens of fit+predict calls per
        model. Does not change `/analytics/models/forecast/{ticker}`'s contract at all.

        Defaults to the cheap model set (arima/ets/sarima/prophet/ridge/naive);
        random_forest/xgboost/lstm require `allow_heavy=true`. `naive` is always
        included even if omitted from `models`, so every other model gets a
        `rmse_vs_naive` baseline comparison per fold.

        Poll `GET /tasks/status/{task_id}` for progress/result.
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string, example: 9988.HK }
        - name: models
          in: query
          required: false
          description: Repeatable. Defaults to arima,ets,sarima,prophet,ridge,naive.
          schema:
            type: array
            items: { type: string }
          example: [arima, naive]
        - name: min_train
          in: query
          required: false
          schema: { type: integer, default: 504 }
        - name: origin_step
          in: query
          required: false
          schema: { type: integer, default: 30 }
        - name: horizon
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 7, maximum: 90 }
        - name: window
          in: query
          required: false
          schema: { type: string, default: expanding, enum: [expanding, sliding] }
        - name: period
          in: query
          required: false
          schema: { type: string, default: 5y, enum: [6m, 1y, 2y, 5y] }
        - name: allow_heavy
          in: query
          required: false
          description: Required to include random_forest/xgboost/lstm.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Task queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollingValidationQueuedResponse"
              example:
                task_id: 170e525a-8565-4425-acc4-cff549ca8e39
                status: queued
                queue: longrunning_queue
                ticker: 9988.HK
                models: [arima, naive]
        "400":
          description: Unknown model, or a heavy model requested without allow_heavy=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/batch-benchmark:
    post:
      tags: [Validation]
      summary: Start a batch benchmark across many tickers x models (always async)
      description: |
        Runs every (ticker, model) pair through the same single-holdout protocol as
        `/analytics/models/forecast/{ticker}` (`BaseForecastModel.run()`, 80/20
        holdout). One Celery task for the whole batch, bounded by a per-task time
        limit (soft 25min / hard 30min).

        Select tickers explicitly, or by `country`/`sector` (resolved to tickers
        server-side). `models` defaults to every registered model except `lstm`
        (off by default — pass it explicitly to include it).

        `stats=true` additionally runs a Friedman test across models plus pairwise
        Wilcoxon signed-rank tests with Holm correction, on the tickers where every
        model produced a result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchBenchmarkRequest"
            example:
              country: Japan
              models: [arima, naive, ets]
              horizon: 30
              period: 1y
              stats: true
      responses:
        "200":
          description: Task queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchBenchmarkQueuedResponse"
              example:
                task_id: 2f6a1c9e-5b3d-4e7a-8f12-3c4d5e6f7a8b
                status: queued
                queue: longrunning_queue
                tickers: ["7203.T", "6758.T", "9984.T"]
                models: [arima, naive, ets]
        "400":
          description: Unknown model, or neither tickers nor country/sector given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No companies matched the given country/sector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/batch-benchmark/{task_id}/status:
    get:
      tags: [Validation]
      summary: Progress-aware status for a batch benchmark task
      description: >-
        Distinct from the generic `/tasks/status/{task_id}` (which only reports
        PENDING/STARTED/SUCCESS/FAILURE): while running, `progress` reports
        `{done, total}` pairs completed, via Celery's own PROGRESS state.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  status: { type: string, example: PROGRESS }
                  progress:
                    type: object
                    nullable: true
                    properties:
                      done: { type: integer }
                      total: { type: integer }

  /analytics/batch-benchmark/{task_id}/results:
    get:
      tags: [Validation]
      summary: Final results for a batch benchmark task
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status, and the full result once SUCCESS (null otherwise)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchBenchmarkResultEnvelope"
        "500":
          description: The task itself failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal/fundamentals/{ticker}:
    servers:
      - url: http://localhost:8000
        description: Local Docker (python-api container) — direct only, not proxied by Nginx. Called container-to-container at http://python-api:8000 by scripts/collectFundamentals.js.
    get:
      tags: [Internal]
      summary: Live fundamentals fetch via yfinance (internal only)
      description: |
        Fetches live fundamentals for one ticker via yfinance, running inside this
        container so yfinance only needs to be installed here — not on whatever host
        runs `scripts/collectFundamentals.js`, which calls this endpoint once per
        ticker and upserts the result into the `fundamentals` table.

        Always returns 200 with all fields `null` (plus an `error` string) if the
        yfinance fetch itself fails — never propagates that as an HTTP error, since
        the caller treats missing fundamentals as an expected, storable outcome.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            example: 9988.HK
      responses:
        "200":
          description: Fundamentals fetched (or a clean per-field-null failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalFundamentals"
              example:
                pe_ratio: 19.71875
                eps: 6.4
                dividend_yield: 0.83
                beta: 0.51
                market_cap: 2419883769856

  /internal/cache/invalidate:
    servers:
      - url: http://localhost:8000
        description: Local Docker (python-api container) — direct only, not proxied by Nginx. Called container-to-container at http://python-api:8000 by server/utils/deltaFetch.js.
    delete:
      tags: [Internal]
      summary: Flush all cached forecasts (internal only)
      description: |
        Deletes every `forecast:*` key from Redis (SCAN + DELETE, not the blocking
        `KEYS` command). Called by `server/utils/deltaFetch.js` after a delta fetch
        actually adds new price rows, so cached `random_forest`/`xgboost`/`lstm`
        forecasts never outlive the price data they were computed from. Not called
        when the delta fetch finds nothing to update — the cache is still valid.
      responses:
        "200":
          description: Cache flushed
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    description: Number of forecast:* keys removed
                    example: 2

  /admin:
    servers:
      - url: http://localhost:8000
        description: Local Docker (python-api container) — direct only, not proxied by Nginx
    get:
      tags: [Admin]
      summary: Static operator dashboard (HTML)
      description: |
        Serves `app/static/admin.html` — a static page for watching Celery task activity. It
        calls the `/tasks/*` endpoints and subscribes to the `/ws/tasks` WebSocket from the
        browser for live updates.

        Registered with `include_in_schema=False` in FastAPI, so it never appears in this
        service's own auto-generated OpenAPI/Swagger UI — documented here by hand instead.
      responses:
        "200":
          description: The dashboard HTML page
          content:
            text/html:
              schema:
                type: string

  /tasks/email:
    servers:
      - url: http://localhost:8000
        description: Local Docker (python-api container) — direct only, not proxied by Nginx
    post:
      tags: [Tasks]
      summary: Trigger an email notification task (simulated send)
      description: |
        Queues a Celery task on `email_queue` that logs a simulated "send" to each user — no
        real email is sent. If `top_movers` is omitted, the task fetches the top 5 companies by
        weekly return itself before "sending".
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            example:
              users: [admin@example.com, analyst@example.com]
      responses:
        "200":
          description: Task queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskQueuedResponse"
              example:
                task_id: 170e525a-8565-4425-acc4-cff549ca8e39
                status: queued
                queue: email_queue

  /tasks/analysis:
    servers:
      - url: http://localhost:8000
        description: Local Docker (python-api container) — direct only, not proxied by Nginx
    post:
      tags: [Tasks]
      summary: Trigger a full market analysis task
      description: |
        Queues a Celery task on `longrunning_queue` that computes, per country, company count,
        average close price, average weekly return, and best/worst weekly return across every
        company with price data. Takes no parameters.
      responses:
        "200":
          description: Task queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskQueuedResponse"
              example:
                task_id: 9b1e3c2a-1234-4a5b-9c8d-abcdef123456
                status: queued
                queue: longrunning_queue

  /tasks/status/{task_id}:
    servers:
      - url: http://localhost:8000
        description: Local Docker (python-api container) — direct only, not proxied by Nginx
    get:
      tags: [Tasks]
      summary: Generic Celery task status/result
      description: |
        Works for any task queued by this API — `/tasks/email`, `/tasks/analysis`,
        `/analytics/validation/rolling/{ticker}`, or `/analytics/batch-benchmark`. `status` is
        Celery's own state string (`PENDING`, `STARTED`, `SUCCESS`, `FAILURE`, ...). `result` is
        populated only once the task is ready (`SUCCESS` or `FAILURE`); `null` while still
        running.

        For the batch-benchmark task specifically, prefer
        `GET /analytics/batch-benchmark/{task_id}/status` while it's running — it reports
        `{done, total}` progress, which this generic endpoint does not.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string, example: 170e525a-8565-4425-acc4-cff549ca8e39 }
      responses:
        "200":
          description: Current status (and result, once ready)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusResponse"
              example:
                task_id: 170e525a-8565-4425-acc4-cff549ca8e39
                status: SUCCESS
                result:
                  users_notified: 2
                  top_movers_included: 5
                  top_movers: []
                  emails:
                    - user: admin@example.com
                      status: sent

  /tasks/history:
    servers:
      - url: http://localhost:8000
        description: Local Docker (python-api container) — direct only, not proxied by Nginx
    get:
      tags: [Tasks]
      summary: Recently completed tasks
      description: |
        Returns up to `limit` most-recently-completed tasks from the `task_results` table —
        any operation (`send_email_notification`, `run_market_analysis`,
        `run_rolling_validation`, `run_batch_benchmark`), most recent first. `input_data` and
        `result` are the JSON the task was called with / returned.

        Returns `[]` (not an HTTP error) if the table doesn't exist yet or the query fails for
        any other reason.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Task history, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskHistoryItem"

  /api/health:
    servers:
      - url: http://localhost:4000
        description: Local Docker (node-api container)
      - url: http://localhost:3000/api
        description: Via Nginx proxy (production)
    get:
      tags: [Gateway]
      summary: Gateway health + in-memory price-cache status
      description: |
        Reports the composition of the Node gateway's in-memory price cache: how many entries
        are bundled seed data vs. live-fetched, which upstream source (Yahoo Finance vs. Twelve
        Data) supplied each live entry, and how many live entries are stale (not refreshed in
        the last 12h).
      responses:
        "200":
          description: Gateway is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayHealthResponse"
              example:
                status: ok
                cache:
                  total: 272
                  live: 260
                  seed: 12
                  stale: 3
                  bySource: { yahoo: 240, twelve: 20 }

  /api/companies:
    servers:
      - url: http://localhost:4000
        description: Local Docker (node-api container)
      - url: http://localhost:3000/api
        description: Via Nginx proxy (production)
    get:
      tags: [Gateway]
      summary: All companies with latest price + weekly return
      description: |
        One row per company that currently has a valid latest close price — companies with no
        price data are dropped from the response, not returned with null fields. `marketCap` is
        always `null`: a placeholder field, not yet populated from any data source.
      responses:
        "200":
          description: Company list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatewayCompany"

  /api/countries:
    servers:
      - url: http://localhost:4000
        description: Local Docker (node-api container)
      - url: http://localhost:3000/api
        description: Via Nginx proxy (production)
    get:
      tags: [Gateway]
      summary: Per-country aggregates
      description: |
        One row per country among companies with a valid price, sorted by `companyCount`
        descending. `sectors` is a count-by-sector map (sector name -> number of companies in
        that country), not a market-cap or price breakdown.
      responses:
        "200":
          description: Country aggregates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatewayCountry"
              example:
                - country: Japan
                  companyCount: 22
                  sectors: { Financials: 5, "Information Technology": 4 }
                  averageWeeklyReturn: 0.42

  /api/sectors:
    servers:
      - url: http://localhost:4000
        description: Local Docker (node-api container)
      - url: http://localhost:3000/api
        description: Via Nginx proxy (production)
    get:
      tags: [Gateway]
      summary: Per-sector aggregates
      description: One row per sector among companies with a valid price, sorted alphabetically by name.
      responses:
        "200":
          description: Sector aggregates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatewaySector"

  /api/sector-leaders:
    servers:
      - url: http://localhost:4000
        description: Local Docker (node-api container)
      - url: http://localhost:3000/api
        description: Via Nginx proxy (production)
    get:
      tags: [Gateway]
      summary: Highest-price company in each sector
      description: |
        Despite the name, "leader" means the highest raw `stockPrice` in local currency within
        the sector — **not** market cap. Prices are compared as-is across companies that trade
        in different currencies, so this ranking is currency-naive. One entry per sector that
        has at least one company with a valid price.
      responses:
        "200":
          description: One leader company per sector
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatewaySectorLeader"

  /api/market-overview:
    servers:
      - url: http://localhost:4000
        description: Local Docker (node-api container)
      - url: http://localhost:3000/api
        description: Via Nginx proxy (production)
    get:
      tags: [Gateway]
      summary: Platform-wide totals
      description: Aggregates every company with a valid price into a per-country company count plus an overall average weekly return.
      responses:
        "200":
          description: Platform-wide totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayMarketOverview"
              example:
                totalCompanies: 272
                avgWeeklyReturn: 0.31
                countries:
                  Japan: { companies: 22 }
                  China: { companies: 30 }

  /api/top-movers:
    servers:
      - url: http://localhost:4000
        description: Local Docker (node-api container)
      - url: http://localhost:3000/api
        description: Via Nginx proxy (production)
    get:
      tags: [Gateway]
      summary: Biggest weekly gainers or losers
      description: |
        Only companies with both a valid price **and** a non-null weekly return are eligible
        (unlike `/api/companies`, which includes every priced company regardless of return).
      parameters:
        - name: count
          in: query
          required: false
          description: Number of companies to return (capped at 20 server-side even if a larger value is passed)
          schema: { type: integer, default: 5, maximum: 20, example: 5 }
        - name: direction
          in: query
          required: false
          description: Any value other than "down" is treated as "up".
          schema: { type: string, default: up, enum: [up, down], example: up }
      responses:
        "200":
          description: Top movers, sorted by weekly return (descending for up, ascending for down)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatewayTopMover"

  /api/macros:
    servers:
      - url: http://localhost:4000
        description: Local Docker (node-api container)
      - url: http://localhost:3000/api
        description: Via Nginx proxy (production)
    get:
      tags: [Gateway]
      summary: World Bank macro indicators for one country
      description: |
        Proxies three World Bank indicators — GDP (current US$, `NY.GDP.MKTP.CD`), total
        population (`SP.POP.TOTL`), and unemployment rate (`SL.UEM.TOTL.ZS`) — fetched live from
        `api.worldbank.org`, returning each indicator's most recent non-null value.

        Only 10 of the platform's 14 countries are mapped to a World Bank country code: China,
        India, Indonesia, Japan, Malaysia, Saudi Arabia, Singapore, South Korea, Taiwan,
        Thailand. Hong Kong, Pakistan, UAE, and Vietnam are not mapped and return 400.
      parameters:
        - name: country
          in: query
          required: true
          description: One of the 10 World-Bank-mapped countries listed above (exact name match).
          schema: { type: string, example: Japan }
      responses:
        "200":
          description: Macro indicators for the country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayMacro"
              example:
                country: Japan
                code: JP
                gdp: 4204495000000
                population: 123930000
                unemployment: 2.5
        "400":
          description: Missing `country`, or `country` is not one of the 10 World-Bank-mapped names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "500":
          description: One or more World Bank API calls failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"

  /api/history/{ticker}:
    servers:
      - url: http://localhost:4000
        description: Local Docker (node-api container)
      - url: http://localhost:3000/api
        description: Via Nginx proxy (production)
    get:
      tags: [Gateway]
      summary: Raw OHLCV history for one ticker
      description: |
        Unprocessed daily OHLCV rows from `daily_prices` — no moving average, no forecasting
        (see the Python service's `/analytics/rolling/{ticker}` and
        `/analytics/models/forecast/{ticker}` for those). An unrecognized `period` value falls
        back to 365 days of history, but the response still echoes back whatever string was
        passed (or `"1y"` if the parameter was omitted entirely).
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string, example: 9988.HK }
        - name: period
          in: query
          required: false
          description: 3m | 6m | 1y | 2y — note there is no 5y option here, unlike the Python service's period parameters.
          schema: { type: string, default: 1y, enum: [3m, 6m, 1y, 2y], example: 1y }
      responses:
        "200":
          description: OHLCV history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayHistoryResponse"
        "404":
          description: No price data for ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"

  /api/fundamentals/{ticker}:
    servers:
      - url: http://localhost:4000
        description: Local Docker (node-api container)
      - url: http://localhost:3000/api
        description: Via Nginx proxy (production)
    get:
      tags: [Gateway]
      summary: Stored fundamentals for one ticker
      description: |
        Reads one row from the `fundamentals` table, populated out-of-band by
        `scripts/collectFundamentals.js` — which itself calls the Python service's
        `GET /internal/fundamentals/{ticker}` (a live yfinance fetch) and upserts the result
        here. This endpoint never calls yfinance or the Python service directly; it only reads
        what has already been collected, so a ticker with no prior collection run returns 404.
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string, example: 9988.HK }
      responses:
        "200":
          description: Stored fundamentals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayFundamentals"
        "404":
          description: No fundamentals stored for ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "500":
          description: Database query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"

components:
  schemas:

    StatBlock:
      type: object
      description: Descriptive statistics for a numeric series
      properties:
        mean:   { type: number, example: 3241.85 }
        median: { type: number, example: 1850.5  }
        std:    { type: number, example: 4102.33 }
        min:    { type: number, example: 112.4   }
        max:    { type: number, example: 19800.0 }
        count:  { type: integer, example: 22     }

    SummaryResponse:
      type: object
      properties:
        filters:
          type: object
          properties:
            country: { type: string, nullable: true, example: Japan }
            sector:  { type: string, nullable: true, example: null  }
        companyCount:
          type: integer
          example: 22
        price:
          type: object
          allOf:
            - $ref: "#/components/schemas/StatBlock"
          nullable: true
        weeklyReturn:
          type: object
          allOf:
            - $ref: "#/components/schemas/StatBlock"
          nullable: true

    RollingDataPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2024-06-15"
        close:
          type: number
          example: 72.45
      additionalProperties:
        type: number
        description: Dynamic key maN where N is the window size (e.g. ma30)

    RollingResponse:
      type: object
      properties:
        ticker:
          type: string
          example: 9988.HK
        window:
          type: integer
          example: 30
        period:
          type: string
          example: 1y
        data:
          type: array
          items:
            $ref: "#/components/schemas/RollingDataPoint"

    HistoryPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2024-06-15"
        actual:
          type: number
          example: 72.45

    ForecastPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2025-01-06"
        predicted:
          type: number
          example: 74.32
        lower:
          type: number
          description: Lower bound of 95% confidence interval
          example: 68.11
        upper:
          type: number
          description: Upper bound of 95% confidence interval
          example: 80.53

    ForecastResponse:
      type: object
      properties:
        ticker:
          type: string
          example: 9988.HK
        model:
          type: string
          example: ARIMA(1,1,1)
        days:
          type: integer
          example: 30
        period:
          type: string
          example: 1y
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"
        forecast:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"

    Error:
      type: object
      properties:
        detail:
          type: string
          example: No data found for given filters

    ForecastMetrics:
      type: object
      description: CE (compute-efficiency) performance metrics, computed identically for every model.
      properties:
        model_name:
          type: string
          example: arima
        rmse:
          type: number
          nullable: true
          description: Root mean squared error on a 20% holdout split
          example: 13.3555
        mae:
          type: number
          nullable: true
          description: Mean absolute error on a 20% holdout split
          example: 10.7978
        inference_latency_ms:
          type: number
          description: Time to produce the forward forecast, in milliseconds
          example: 97.8
        train_time_s:
          type: number
          description: Time to fit the model on the full history, in seconds
          example: 0.43
        memory_mb:
          type: number
          description: >-
            Python peak memory (tracemalloc) during fit+predict, in MB. Does not see native
            C/C++ allocations (PyTorch, XGBoost, scikit-learn internals) -- see rss_mb for those.
          example: 0.85
        rss_mb:
          type: number
          description: >-
            Whole-process RSS delta during fit+predict, in MB. Coarser than memory_mb but
            includes native allocations tracemalloc can't see.
          example: 0.12

    ModelForecastResponse:
      type: object
      properties:
        ticker:
          type: string
          example: 9988.HK
        model:
          type: string
          example: arima
        days:
          type: integer
          example: 30
        period:
          type: string
          example: 1y
        enriched:
          type: boolean
          description: Whether fundamentals+macro features were actually used (false for models that don't support it, even if requested).
          example: false
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"
        forecast:
          type: array
          description: Forward predictions with 95% confidence interval bounds
          items:
            $ref: "#/components/schemas/ForecastPoint"
        metrics:
          $ref: "#/components/schemas/ForecastMetrics"

    CorrelationPair:
      type: object
      properties:
        ticker_a:
          type: string
          example: 8801.T
        ticker_b:
          type: string
          example: 8830.T
        correlation:
          type: number
          description: Pearson correlation coefficient of daily returns, -1 to 1
          example: 0.8023

    CorrelationResponse:
      type: object
      properties:
        country:
          type: string
          example: Japan
        period:
          type: string
          example: 1y
        order:
          type: string
          enum: [default, clustered]
          example: default
        tickers:
          type: array
          description: Alphabetical order, always present.
          items: { type: string }
        orderedTickers:
          type: array
          nullable: true
          description: Hierarchical-clustering leaf order. Present only when order=clustered.
          items: { type: string }
        pairCount:
          type: integer
          example: 231
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/CorrelationPair"
        topCorrelated:
          type: array
          description: Top 10 most positively correlated pairs
          items:
            $ref: "#/components/schemas/CorrelationPair"
        leastCorrelated:
          type: array
          description: Top 10 most divergent (most negatively correlated) pairs
          items:
            $ref: "#/components/schemas/CorrelationPair"
        computation_time_ms:
          type: number
          example: 20.05

    AnomalyCompany:
      type: object
      properties:
        ticker:
          type: string
          example: 9984.T
        latest_weekly_return:
          type: number
          description: Most recent weekly return, as a fraction (e.g. -0.0613 = -6.13%)
          example: -0.0613
        anomaly_score:
          type: number
          description: IsolationForest anomaly score — higher means more anomalous
          example: 0.1119
        is_anomaly:
          type: boolean
          example: true
        zscore:
          type: number
          description: (latest_weekly_return - own mean) / own std
          example: -0.7327
        detection_method:
          type: string
          nullable: true
          description: >-
            "isolation_forest", "zscore", "both" (isolation_forest+zscore, the original
            two-detector string, unchanged), null, or -- only when include_knn=true --
            "knn_distance" alone or combined with the others (e.g. "isolation_forest+knn_distance").
          example: isolation_forest
        knn_distance:
          type: number
          nullable: true
          description: Present only when the request set include_knn=true.
          example: 0.8123

    AnomalyResponse:
      type: object
      properties:
        country:
          type: string
          example: Japan
        period:
          type: string
          example: 1y
        companyCount:
          type: integer
          example: 22
        anomalyCount:
          type: integer
          example: 2
        companies:
          type: array
          items:
            $ref: "#/components/schemas/AnomalyCompany"
        computation_time_ms:
          type: number
          example: 307.2

    ClusterCompany:
      type: object
      properties:
        ticker:
          type: string
          example: 0001.HK
        name:
          type: string
          example: CK Hutchison Holdings
        country:
          type: string
          example: Hong Kong
        sector:
          type: string
          example: Industrials
        cluster_id:
          type: integer
          example: 0
        mean_weekly_return:
          type: number
          example: 0.0063
        volatility:
          type: number
          description: Standard deviation of weekly returns
          example: 0.0325

    ClusterSummaryItem:
      type: object
      properties:
        cluster_id:
          type: integer
          example: 0
        size:
          type: integer
          example: 111
        mean_return:
          type: number
          nullable: true
          example: 0.0022
        mean_volatility:
          type: number
          nullable: true
          example: 0.0285
        dominant_country:
          type: string
          nullable: true
          example: Singapore
        dominant_sector:
          type: string
          nullable: true
          example: Consumer Staples

    ClusterResponse:
      type: object
      properties:
        n_clusters:
          type: integer
          example: 5
        period:
          type: string
          example: 1y
        companyCount:
          type: integer
          example: 270
        companies:
          type: array
          items:
            $ref: "#/components/schemas/ClusterCompany"
        cluster_summary:
          type: array
          items:
            $ref: "#/components/schemas/ClusterSummaryItem"
        computation_time_ms:
          type: number
          example: 2300.4

    InternalFundamentals:
      type: object
      properties:
        pe_ratio:
          type: number
          nullable: true
          example: 19.71875
        eps:
          type: number
          nullable: true
          example: 6.4
        dividend_yield:
          type: number
          nullable: true
          example: 0.83
        beta:
          type: number
          nullable: true
          example: 0.51
        market_cap:
          type: integer
          nullable: true
          example: 2419883769856
        error:
          type: string
          nullable: true
          description: Present only if the underlying yfinance fetch failed — all other fields are null in that case.

    NetworkNode:
      type: object
      properties:
        ticker: { type: string, example: 1605.T }
        name: { type: string, example: INPEX Corporation }
        sector: { type: string, example: Energy }

    NetworkEdge:
      type: object
      properties:
        source: { type: string, example: 1605.T }
        target: { type: string, example: 5020.T }
        distance:
          type: number
          description: Correlation distance, d = sqrt(2*(1-rho))
          example: 0.9074

    NetworkResponse:
      type: object
      properties:
        country: { type: string, example: Japan }
        period: { type: string, example: 1y }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/NetworkNode" }
        edges:
          type: array
          description: n-1 edges forming the minimum spanning tree.
          items: { $ref: "#/components/schemas/NetworkEdge" }
        computation_time_ms: { type: number, example: 450.2 }

    TaskQueuedResponse:
      type: object
      description: Common shape returned by every endpoint that enqueues a Celery task instead of running inline.
      properties:
        task_id: { type: string, example: 170e525a-8565-4425-acc4-cff549ca8e39 }
        status: { type: string, example: queued }
        queue: { type: string, example: longrunning_queue }

    RollingValidationQueuedResponse:
      description: TaskQueuedResponse plus the resolved ticker/models — specific to POST /analytics/validation/rolling/{ticker}.
      allOf:
        - $ref: "#/components/schemas/TaskQueuedResponse"
        - type: object
          properties:
            ticker: { type: string, example: 9988.HK }
            models:
              type: array
              items: { type: string }
              example: [arima, naive]

    BatchBenchmarkQueuedResponse:
      description: TaskQueuedResponse plus the resolved tickers/models — specific to POST /analytics/batch-benchmark.
      allOf:
        - $ref: "#/components/schemas/TaskQueuedResponse"
        - type: object
          properties:
            tickers:
              type: array
              items: { type: string }
            models:
              type: array
              items: { type: string }

    BatchBenchmarkRequest:
      type: object
      description: Provide `tickers`, or `country`/`sector` to resolve them server-side.
      properties:
        tickers:
          type: array
          nullable: true
          items: { type: string }
        country: { type: string, nullable: true, example: Japan }
        sector: { type: string, nullable: true, example: Financials }
        models:
          type: array
          nullable: true
          description: Defaults to every registered model except lstm.
          items: { type: string }
          example: [arima, naive, ets]
        horizon: { type: integer, default: 30, example: 30 }
        period: { type: string, default: 1y, enum: [6m, 1y, 2y, 5y] }
        stats: { type: boolean, default: false, description: Run Friedman + Wilcoxon-Holm on the results. }

    BatchBenchmarkRow:
      type: object
      properties:
        ticker: { type: string, example: 9988.HK }
        model: { type: string, example: arima }
        error: { type: string, nullable: true }
        rmse: { type: number, nullable: true }
        mae: { type: number, nullable: true }
        rmse_pct: { type: number, nullable: true }
        inference_latency_ms: { type: number, nullable: true }
        train_time_s: { type: number, nullable: true }
        memory_mb: { type: number, nullable: true }

    BatchBenchmarkResult:
      type: object
      properties:
        tickers:
          type: array
          items: { type: string }
        models:
          type: array
          items: { type: string }
        horizon: { type: integer }
        period: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/BatchBenchmarkRow" }
        model_summary:
          type: object
          description: Keyed by model — {n_tickers, mean_rmse_pct, std_rmse_pct, best_model_count}.
        rank_table:
          type: object
          description: Keyed by ticker, then model — RMSE rank (1 = best) among models that produced a result.
        zero_error_tickers:
          type: array
          description: Tickers where every model scored ~0 RMSE — flagged, never silently dropped.
          items: { type: string }
        stats:
          type: object
          nullable: true
          description: >-
            Present only when the request set stats=true. Either
            {complete_tickers, friedman: {statistic, p_value}, pairwise_wilcoxon_holm}
            or {note} if too few tickers/models qualified.

    BatchBenchmarkResultEnvelope:
      type: object
      properties:
        task_id: { type: string }
        status: { type: string, example: SUCCESS }
        result:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BatchBenchmarkResult"

    SimilarCompany:
      type: object
      properties:
        ticker: { type: string, example: 3690.HK }
        name: { type: string, example: Meituan }
        sector: { type: string, example: Consumer Discretionary }
        distance: { type: number, example: 0.7063 }

    SimilarResponse:
      type: object
      properties:
        ticker: { type: string, example: 9988.HK }
        space: { type: string, enum: [features, correlation] }
        scope: { type: string, enum: [country, global] }
        country:
          type: string
          nullable: true
          description: The ticker's own country when scope=country; null when scope=global.
          example: China
        n: { type: integer, example: 5 }
        results:
          type: array
          items: { $ref: "#/components/schemas/SimilarCompany" }
        computation_time_ms: { type: number, example: 47.3 }

    EmailRequest:
      type: object
      description: All fields optional — an empty body falls back to the three example users and a freshly-computed top-5-movers list.
      properties:
        users:
          type: array
          items: { type: string }
          default: [admin@example.com, analyst@example.com, trader@example.com]
        top_movers:
          type: array
          nullable: true
          description: If omitted/null, the task computes the top 5 companies by weekly return itself.
          items: { type: object }

    TaskStatusResponse:
      type: object
      description: Generic shape returned by GET /tasks/status/{task_id}, for any task queued by this API.
      properties:
        task_id: { type: string, example: 170e525a-8565-4425-acc4-cff549ca8e39 }
        status:
          type: string
          description: Celery's own state string.
          enum: [PENDING, STARTED, PROGRESS, SUCCESS, FAILURE, RETRY, REVOKED]
          example: SUCCESS
        result:
          type: object
          nullable: true
          description: The task's return value once status is SUCCESS or FAILURE; null while still running.

    TaskHistoryItem:
      type: object
      properties:
        task_id: { type: string, example: 170e525a-8565-4425-acc4-cff549ca8e39 }
        operation:
          type: string
          enum: [send_email_notification, run_market_analysis, run_rolling_validation, run_batch_benchmark]
          example: run_market_analysis
        input_data:
          type: object
          description: The JSON arguments the task was called with.
        result:
          type: object
          nullable: true
          description: The task's return value.
        status: { type: string, example: success }
        completed_at: { type: string, format: date-time, nullable: true }

    GatewayError:
      type: object
      properties:
        error:
          type: string
          example: Failed to fetch company data

    GatewayHealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        cache:
          type: object
          properties:
            total: { type: integer, example: 272 }
            live: { type: integer, example: 260 }
            seed: { type: integer, example: 12 }
            stale:
              type: integer
              description: Live entries not refreshed in the last 12h.
              example: 3
            bySource:
              type: object
              properties:
                yahoo:  { type: integer, example: 240 }
                twelve: { type: integer, example: 20 }

    GatewayCompany:
      type: object
      properties:
        name:         { type: string, example: Alibaba Group Holding }
        ticker:       { type: string, example: 9988.HK }
        country:      { type: string, example: Hong Kong }
        sector:       { type: string, example: Consumer Discretionary }
        exchange:     { type: string, example: HKEX }
        stockPrice:   { type: number, example: 82.35 }
        weeklyReturn: { type: number, nullable: true, example: 1.42 }
        currency:     { type: string, example: HKD }
        marketCap:
          type: integer
          nullable: true
          description: Always null — placeholder field, not yet populated.
          example: null

    GatewayCountry:
      type: object
      properties:
        country: { type: string, example: Japan }
        companyCount: { type: integer, example: 22 }
        sectors:
          type: object
          description: Sector name -> number of companies in that country.
          additionalProperties: { type: integer }
        averageWeeklyReturn: { type: number, nullable: true, example: 0.42 }

    GatewaySector:
      type: object
      properties:
        name: { type: string, example: Financials }
        companyCount: { type: integer, example: 31 }
        averageWeeklyReturn: { type: number, nullable: true, example: 0.18 }

    GatewaySectorLeader:
      type: object
      properties:
        name:         { type: string, example: Tencent Holdings }
        ticker:       { type: string, example: 0700.HK }
        country:      { type: string, example: Hong Kong }
        sector:       { type: string, example: Communication Services }
        exchange:     { type: string, example: HKEX }
        stockPrice:   { type: number, example: 312.6 }
        weeklyReturn: { type: number, nullable: true, example: -0.8 }
        currency:     { type: string, example: HKD }

    GatewayMarketOverview:
      type: object
      properties:
        totalCompanies: { type: integer, example: 272 }
        avgWeeklyReturn: { type: number, nullable: true, example: 0.31 }
        countries:
          type: object
          description: Country name -> { companies }.
          additionalProperties:
            type: object
            properties:
              companies: { type: integer }

    GatewayTopMover:
      type: object
      properties:
        name:         { type: string, example: SoftBank Group }
        ticker:       { type: string, example: 9984.T }
        country:      { type: string, example: Japan }
        sector:       { type: string, example: Information Technology }
        stockPrice:   { type: number, example: 7427.0 }
        weeklyReturn: { type: number, example: 4.1 }
        currency:     { type: string, example: JPY }

    GatewayMacro:
      type: object
      properties:
        country: { type: string, example: Japan }
        code: { type: string, example: JP }
        gdp: { type: number, nullable: true, example: 4204495000000 }
        population: { type: number, nullable: true, example: 123930000 }
        unemployment: { type: number, nullable: true, example: 2.5 }

    GatewayOhlcvPoint:
      type: object
      description: >-
        `date` serializes as a full ISO-8601 timestamp (the `pg` driver returns Postgres DATE
        values as JS Date objects, at midnight UTC), not a bare YYYY-MM-DD string. open/high/
        low/close (NUMERIC) and volume (BIGINT) serialize as JSON strings, not numbers — same
        node-postgres behavior as GatewayFundamentals. Parse both client-side before use.
      properties:
        date:     { type: string, format: date-time, example: "2024-06-15T00:00:00.000Z" }
        open:     { type: string, nullable: true, example: "71.900000" }
        high:     { type: string, nullable: true, example: "73.200000" }
        low:      { type: string, nullable: true, example: "71.500000" }
        close:    { type: string, nullable: true, example: "72.450000" }
        volume:   { type: string, nullable: true, example: "18234500" }
        currency: { type: string, example: HKD }

    GatewayHistoryResponse:
      type: object
      properties:
        ticker: { type: string, example: 9988.HK }
        period: { type: string, example: 1y }
        data:
          type: array
          items: { $ref: "#/components/schemas/GatewayOhlcvPoint" }

    GatewayFundamentals:
      type: object
      description: >-
        pe_ratio/eps/dividend_yield/beta are Postgres NUMERIC columns, and market_cap is
        BIGINT — node-postgres serializes both as JSON strings (not numbers) by default, to
        avoid precision loss. Parse them client-side before doing arithmetic.
      properties:
        ticker:         { type: string, example: 9988.HK }
        pe_ratio:       { type: string, nullable: true, description: Numeric string., example: "19.71875" }
        eps:            { type: string, nullable: true, description: Numeric string., example: "6.4" }
        dividend_yield: { type: string, nullable: true, description: Numeric string., example: "0.83" }
        beta:           { type: string, nullable: true, description: Numeric string., example: "0.51" }
        market_cap:     { type: string, nullable: true, description: Numeric string (BIGINT)., example: "2419883769856" }
        fetched_at:     { type: string, format: date-time, example: "2026-08-20T10:06:51.022Z" }
